<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel — CVE Research</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b0f14;
            color: #e6edf3;
            display: flex;
            justify-content: center;
        }

        .container {
            width: min(900px, 92%);
            padding: 70px 0;
        }

        .header {
            margin-bottom: 45px;
        }

        .badge {
            display: inline-block;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid #30363d;
            border-radius: 999px;
            padding: 6px 12px;
            color: #8b949e;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 72px);
            margin: 0;
            letter-spacing: -3px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 18px;
            line-height: 1.6;
            max-width: 650px;
            margin-top: 15px;
        }

        .card {
            background: #11161d;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 22px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            background: #0b0f14;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 15px;
            font: inherit;
            outline: none;
        }

        textarea:focus {
            border-color: #58a6ff;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .primary {
            background: #e6edf3;
            color: #0b0f14;
        }

        .secondary {
            background: transparent;
            color: #e6edf3;
            border: 1px solid #30363d;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            color: #8b949e;
            margin-top: 15px;
            font-size: 14px;
        }

        #result {
            display: none;
            margin-top: 25px;
        }

        .answer {
            white-space: pre-wrap;
            line-height: 1.7;
            color: #c9d1d9;
        }

        .meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .tag {
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 12px;
            color: #8b949e;
        }

        footer {
            margin-top: 30px;
            color: #6e7681;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        a {
            color: #58a6ff;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="container">

    <header class="header">
        <div class="badge">CVE Research & Patch Prioritization</div>

        <h1>Sentinel</h1>

        <p class="subtitle">
            Ask security questions grounded in real NVD and OSV vulnerability
            data instead of relying on an LLM's potentially stale knowledge.
        </p>
    </header>

    <main class="card">

        <textarea
            id="question"
            maxlength="500"
            placeholder="e.g. What is CVE-2014-3730?"
        ></textarea>

        <div class="actions">
            <button class="primary" id="askBtn">
                Ask Sentinel
            </button>

            <button class="secondary" id="demoBtn">
                Try cached demo
            </button>
        </div>

        <div id="status"></div>

        <section id="result">

            <h2>Answer</h2>

            <div class="answer" id="answer"></div>

            <div class="meta">
                <div class="tag" id="retrieved"></div>
                <div id="cves"></div>
            </div>

        </section>

    </main>

    <footer>
        <span>NVD · OSV · Chroma · FastAPI</span>

        <a href="/docs" target="_blank">
            API Documentation →
        </a>
    </footer>

</div>

<script>
    const questionInput = document.getElementById("question");
    const askBtn = document.getElementById("askBtn");
    const demoBtn = document.getElementById("demoBtn");

    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const answer = document.getElementById("answer");
    const retrieved = document.getElementById("retrieved");
    const cves = document.getElementById("cves");

    async function ask(endpoint) {
        const question = questionInput.value.trim();

        if (!question) {
            status.textContent = "Enter a question first.";
            return;
        }

        askBtn.disabled = true;
        demoBtn.disabled = true;
        result.style.display = "none";

        status.textContent =
            endpoint === "/ask/demo"
                ? "Loading cached response..."
                : "Researching vulnerability data...";

        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ question })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Request failed.");
            }

            answer.textContent = data.answer;

            retrieved.textContent =
                `Retrieved: ${data.retrieved_count} documents`;

            cves.innerHTML = "";

            for (const cve of data.cited_cve_ids) {
                const tag = document.createElement("span");
                tag.className = "tag";
                tag.textContent = cve;
                cves.appendChild(tag);
            }

            result.style.display = "block";
            status.textContent = "Done.";

        } catch (error) {
            status.textContent = error.message;
        } finally {
            askBtn.disabled = false;
            demoBtn.disabled = false;
        }
    }

    askBtn.addEventListener("click", () => ask("/ask"));
    demoBtn.addEventListener("click", () => ask("/ask/demo"));
</script>

</body>
</html>
